<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1118">
<title>Vigía · Aventura de almas</title>
<style>
html,body{margin:0;height:100%;background:#0f1118;color:#ece7d8;font:16px/1.4 system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
h1{font:700 26px Georgia,serif;color:#e6b450;margin:0}
.dot{width:22px;height:22px;border-radius:50%;background:#e5484d;display:inline-block;vertical-align:middle;margin-right:8px;box-shadow:0 0 0 0 #3fbf7f}
.dot.on{background:#3fbf7f;animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 #3fbf7f88}70%{box-shadow:0 0 0 14px #3fbf7f00}100%{box-shadow:0 0 0 0 #3fbf7f00}}
.box{background:#181c27;border:1px solid #2c3350;border-radius:14px;padding:12px 16px;min-width:260px}
.dim{color:#8f94a8;font-size:14px}
button{min-height:46px;padding:10px 18px;border-radius:11px;border:1px solid #e6b450;background:#e6b450;color:#1b1608;font:600 16px system-ui;cursor:pointer}
</style>
</head>
<body>
<h1>Vigía de Aventura de almas</h1>
<div><span class="dot" id="dot"></span><b id="st">Comprobando…</b></div>
<div class="box" id="info" class="dim">—</div>
<div class="dim" id="wl">Pantalla: …</div>
<button id="wake">Mantener pantalla encendida</button>
<p class="dim" style="max-width:340px">Deja este celular enchufado con esta página abierta. Cada minuto avisa al servidor para que no se duerma y las partidas sigan avanzando.</p>
<script>
let wakeLock = null, last = 0, fails = 0;
async function ping() {
  try {
    const r = await fetch('/health', { cache: 'no-store' }); const d = await r.json();
    fails = 0; last = Date.now();
    document.getElementById('dot').className = 'dot on';
    document.getElementById('st').textContent = 'Servidor despierto';
    const playing = d.games.filter(g => g.status === 'playing');
    document.getElementById('info').innerHTML = `Jugadores conectados: <b>${d.conns}</b><br>Partidas en curso: <b>${playing.length}</b>` +
      playing.map(g => `<br><span class="dim">${g.code} · turno ${g.turn} · termina ${new Date(g.endsAt).toLocaleString()}</span>`).join('');
  } catch (e) {
    fails++;
    document.getElementById('dot').className = 'dot';
    document.getElementById('st').textContent = fails > 1 ? 'Sin respuesta del servidor (reintentando)…' : 'Despertando servidor…';
  }
}
async function wake() {
  try {
    if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { document.getElementById('wl').textContent = 'Pantalla: puede apagarse'; }); document.getElementById('wl').textContent = 'Pantalla: se mantiene encendida'; }
    else document.getElementById('wl').textContent = 'Tu navegador no permite mantener la pantalla encendida; desactiva el bloqueo automático en Ajustes.';
  } catch (e) { document.getElementById('wl').textContent = 'No se pudo activar (toca el botón)'; }
}
document.getElementById('wake').onclick = wake;
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); ping(); } });
ping(); wake(); setInterval(ping, 60000);
</script>
</body>
</html>
