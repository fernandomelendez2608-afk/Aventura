services:
  - type: web
    name: aventura-de-almas
    runtime: node
    plan: free
    buildCommand: echo "sin dependencias"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      # Guardado permanente gratis (ver README, sección «Guardado en la nube»):
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
